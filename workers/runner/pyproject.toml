[project]
name = "oneiroi-runner"
version = "0.1.0"
description = "Fixed-GPU inference runner for Oneiroi Studio"
requires-python = ">=3.12,<3.14"
dependencies = [
    "oneiroi-common",
    "pydantic-settings>=2.7.1,<3",
    "redis>=5.2.1,<7",
    "structlog>=25.1.0,<26",
]

[project.scripts]
oneiroi-runner = "oneiroi_runner.main:run"

[tool.uv.sources]
oneiroi-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
