[project]
name = "oneiroi-gateway"
version = "0.1.0"
description = "Private H100 Gateway for Oneiroi Studio"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.14.1,<2",
    "asyncpg>=0.30.0,<1",
    "fastapi>=0.115.8,<1",
    "oneiroi-common",
    "pydantic-settings>=2.7.1,<3",
    "redis>=5.2.1,<7",
    "nvidia-ml-py>=12.560,<13",
    "pillow>=11.1,<13",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy[asyncio]>=2.0.38,<3",
    "structlog>=25.1.0,<26",
    "uvicorn[standard]>=0.34.0,<1",
]

[tool.uv.sources]
oneiroi-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
