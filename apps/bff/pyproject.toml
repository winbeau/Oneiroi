[project]
name = "oneiroi-bff"
version = "0.1.0"
description = "Pi-side same-origin BFF for Oneiroi Studio"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.8,<1",
    "httpx>=0.28.1,<1",
    "oneiroi-common",
    "pydantic-settings>=2.7.1,<3",
    "uvicorn[standard]>=0.34.0,<1",
]

[tool.uv.sources]
oneiroi-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
